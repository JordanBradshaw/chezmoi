##### GENERAL #####

# Set prefix to Ctrl-a (common modern choice); comment out to keep default
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# True color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Start window and pane index at 1
set -g base-index 1
set -g pane-base-index 1

# Automatically renumber windows when one is removed
set -g renumber-windows on

# Reload config quickly. Under zssh the config lives in the bundle, so find it
# through XDG_CONFIG_HOME.
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"' \; display-message "tmux reloaded"

##### APPEARANCE #####
# Colors come from the catppuccin plugin (see PLUGINS).
set -g status-position bottom
set -g status-interval 5

##### NAVIGATION #####

# Use vim-style pane movement
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows using Alt + arrows
bind -n M-Left previous-window
bind -n M-Right next-window

##### YAKUAKE SHORTCUTS #####
# Yakuake's shortcuts, behind the prefix: Yakuake grabs them before tmux sees
# them, and terminals can't send most of them (Ctrl+Shift+T arrives as
# Ctrl+T). Yakuake sessions are tmux windows, its split terminals are panes.

# new-session: Ctrl+Shift+T / Ctrl+Shift+N
bind T new-window -c "#{pane_current_path}"
bind N new-window -c "#{pane_current_path}"
# close-active-terminal: Ctrl+Shift+R / Ctrl+Shift+Q (prefix r reloads)
bind R kill-pane
bind Q kill-pane
# previous/next-session: Shift+Left/Right, Ctrl+Shift+Left/Right
bind -r Left previous-window
bind -r S-Left previous-window
bind -r C-S-Left previous-window
bind -r Right next-window
bind -r S-Right next-window
bind -r C-S-Right next-window
# previous/next-terminal: Ctrl+Shift+Up/Down, Ctrl+Shift+Tab / Ctrl+Tab
bind -r Up select-pane -t :.-
bind -r C-S-Up select-pane -t :.-
bind -r BTab select-pane -t :.-
bind -r Down select-pane -t :.+
bind -r C-S-Down select-pane -t :.+
bind -r Tab select-pane -t :.+
# split-left-right: Ctrl++, split-top-bottom: Ctrl+_
bind + split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
# switch-to-session-1..10: Alt+1..0 (1-9 are tmux defaults with base-index 1)
bind 0 select-window -t :=10

##### MOUSE #####

# Enable full mouse support
set -g mouse on

##### COPY / CLIPBOARD #####

# Use vim mode for copy; tmux-yank binds y (see PLUGINS)
setw -g mode-keys vi

# Also send copies to the outer terminal's clipboard (OSC 52), which is how
# they reach the laptop from an ssh session.
set -s set-clipboard on

##### QUALITY OF LIFE #####

# Smart pane switching (copy vim/tmux integrated behaviour)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Quickly split panes
bind - split-window -v
bind | split-window -h

# Faster command sequences
set-option -s escape-time 10

# Increase scrollback history
set -g history-limit 100000

##### PLUGINS #####
# Downloaded by chezmoi externals into plugins/ (bundled by zssh too) and
# loaded in order by load-plugins.sh; no TPM. Order matters: catppuccin sets
# the status line, prefix-highlight fills its placeholder in it, and
# continuum must come last because it hooks its autosave into status-right.

# History file, resurrect/logging dirs and the yank clipboard command depend
# on the host and XDG dirs.
run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/host-options.sh"'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @prefix_highlight_show_copy_mode "on"
# extrakto's default key (Tab) is the Yakuake next-pane mapping.
set -g @extrakto_key "e"
set -g @continuum-restore "on"

run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/load-plugins.sh" tmux-sensible catppuccin'

set -g status-left-length 100
set -g status-right-length 200
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{prefix_highlight}#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}"

run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/load-plugins.sh" tmux-prefix-highlight tmux-yank tmux-logging extrakto tmux-resurrect tmux-continuum'
