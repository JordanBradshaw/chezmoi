# ============================================================
# KONSOLE-STYLE TMUX KEYBINDINGS
# ============================================================

# Use default tmux prefix: Ctrl+B
# All Konsole-equivalent bindings below work without a prefix.

# ------------------------------------------------------------
# WINDOWS / TABS
# ------------------------------------------------------------

# New session/tab -> new tmux window
bind -n C-S-t new-window
bind -n C-S-n new-window

# Close active terminal
bind -n C-S-r kill-pane
bind -n C-S-q kill-pane

# Next / previous window
bind -n S-Right next-window
bind -n C-S-Right next-window

bind -n S-Left previous-window
bind -n C-S-Left previous-window

# Switch to windows 1-10
set -g base-index 1
set -g renumber-windows on

bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# Alternate Ctrl+Shift+number shortcuts
# These depend on Konsole's keyboard protocol support.
bind -n C-! select-window -t :=1
bind -n C-@ select-window -t :=2
bind -n C-# select-window -t :=3
bind -n C-$ select-window -t :=4
bind -n C-% select-window -t :=5
bind -n C-^ select-window -t :=6
bind -n C-& select-window -t :=7
bind -n C-* select-window -t :=8
bind -n C-( select-window -t :=9
bind -n C-) select-window -t :=10

# ------------------------------------------------------------
# SPLIT TERMINALS
# ------------------------------------------------------------

# Konsole: Ctrl++
bind -n C-+ split-window -h

# Konsole: Ctrl+_
bind -n C-_ split-window -v

# ------------------------------------------------------------
# PANE NAVIGATION
# ------------------------------------------------------------

# Konsole: Ctrl+Tab / Ctrl+Shift+Tab
bind -n C-Tab select-pane -t :.+
bind -n C-S-Tab select-pane -t :.-

# Konsole: Ctrl+Shift+Down / Ctrl+Shift+Up
bind -n C-S-Down select-pane -t :.+
bind -n C-S-Up select-pane -t :.-

# ------------------------------------------------------------
# GROW TERMINAL
# Konsole: Ctrl+Alt+Arrow
# ------------------------------------------------------------

bind -n C-M-Down resize-pane -D 2
bind -n C-M-Left resize-pane -L 2
bind -n C-M-Right resize-pane -R 2
bind -n C-M-Up resize-pane -U 2

# ------------------------------------------------------------
# WINDOW RESIZING
# Konsole: Ctrl+Alt+Shift+Arrow
#
# tmux cannot directly resize the outer Konsole window.
# These resize the active tmux pane instead.
# ------------------------------------------------------------

bind -n C-M-S-Up resize-pane -U 2
bind -n C-M-S-Down resize-pane -D 2
bind -n C-M-S-Left resize-pane -L 2
bind -n C-M-S-Right resize-pane -R 2

# ------------------------------------------------------------
# COPY / PASTE
# ------------------------------------------------------------

set -g mode-keys vi
set -g set-clipboard on

# Konsole: Ctrl+Shift+C / Ctrl+Insert
# Copy selection in tmux copy mode.
bind -T copy-mode-vi C-S-c send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-Insert send-keys -X copy-selection-and-cancel

# Konsole: Ctrl+Shift+V / Shift+Insert
bind -n C-S-v paste-buffer
bind -n S-Insert paste-buffer

# Konsole: Ctrl+Shift+Insert
bind -n C-S-Insert paste-buffer

# Konsole: Ctrl+Shift+A
# Select all available history in copy mode.
bind -n C-S-a copy-mode \; send-keys -X history-top \; send-keys -X begin-selection \; send-keys -X history-bottom

# ------------------------------------------------------------
# FIND
# ------------------------------------------------------------

# Konsole: Ctrl+Shift+F
bind -n C-S-f copy-mode \; send-keys -X search-forward

# Konsole: F3 / Shift+F3
bind -T copy-mode-vi F3 send-keys -X search-again
bind -T copy-mode-vi S-F3 send-keys -X search-reverse

# ------------------------------------------------------------
# CLEAR HISTORY AND RESET
# ------------------------------------------------------------

# Konsole: Ctrl+Shift+K
bind -n C-S-k clear-history \; send-keys C-l

# ------------------------------------------------------------
# SELECT MODE
# ------------------------------------------------------------

# Konsole: Ctrl+Shift+D
bind -n C-S-d copy-mode

# ------------------------------------------------------------
# MOUSE
# ------------------------------------------------------------

set -g mouse on