[global]
target = "~/.local/bin"
show_hash = true
upgrade_only = true

["yutat23/lsoff"]
#asset = "linux-amd64"
file = "lsoff"

["matheus-git/systemd-manager-tui"]
asset_filters = [ "^deb", "^rpm" ]
asset = "systemd-manager-tui"


["thobiasn/tori-cli"]
asset_filters = [ "linux" , "amd64" ]
file = "tori"

["imsnif/bandwhich"]
asset_filters = [ "gnu" ]
file = "bandwhich"

["lance0/xfr"]
asset_filters = [ "musl" ]
file = "xfr"

["karol-broda/snitch"]
asset_filters = [ "tar.gz" ]
file = "snitch"

["gnomeria/usbtree"]
asset_filters = [ "tar.gz" ]
file = "usbtree"

# The x86_64 build is a tar.gz inside a zip, which eget can't unpack; the
# static i386 build runs on x86_64.
["bee-san/RustScan"]
asset_filters = [ "x86-linux" ]
file = "rustscan"

["matthart1983/diskwatch"]
asset_filters = [ "static", ".tar.gz" ]
target = "~/.local/bin/diskwatch"

["Lifailon/lazyjournal"]

["jesseduffield/lazydocker"]

["jesseduffield/lazygit"]


["westpoint-io/lazyrsync"]
asset_filters = [ "gnu" ]

["dimonomid/nerdlog"]
asset_filters = [ "tar.gz", "^.sbom.json" ]

["rgwood/systemctl-tui"]

["orhun/systeroid"]
asset_filters = [ "x86_64", "gnu", "all-features", "tar.gz", "^.sha512", "^.sig" ]

["depot/cli"]
file = "bin/depot"

["mikeleppane/envx"]
asset_filters = [ "amd64", "static" ]

["alajmo/sake"]
asset_filters = [ "amd64" ]

["neovim/neovim"]
asset_filters = ["x86_64", "linux", "tar.gz"]
file = "nvim-linux-x86_64/bin/nvim"

["denilsonsa/prettyping"]
asset_filters = ["tar.gz"]

["ankittk/peek"]
asset = ["peek_1.1_amd64.deb", "peek_1.1_amd64.deb"]

["pythops/oryx"]
asset_filters = ["x86_64"]