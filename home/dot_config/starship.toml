add_newline = true

[character]
success_symbol = "[➜](bold)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_status]
conflicted = "⚔️ "
ahead = "⇡"
behind = "⇣"
staged = "+"
modified = "!"
untracked = "?"

[cmd_duration]
min_time = 2000
format = "⏱ $duration "

[shell]
disabled = true
