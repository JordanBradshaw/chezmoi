[window]
decorations = "full"
dynamic_padding = true
opacity = 0.96
padding = { x = 6, y = 6 }
startup_mode = "Windowed"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0

[scrolling]
history = 100000
multiplier = 3

[env]
# Truecolor for apps inside tmux
TERM = "xterm-256color"

# Start tmux automatically
[shell]
program = "/usr/bin/tmux"
args = ["new-session", "-A", "-D", "-s", "main"]

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[keyboard]
# Kitty-like copy/paste and font size controls
bindings = [
  # Copy / paste
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # Font size
  { key = "+", mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "-", mods = "Control|Shift", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control|Shift", action = "ResetFontSize" },

  # New terminal window
  { key = "Enter", mods = "Control|Shift", command = { program = "/usr/bin/alacritty" } },
]
